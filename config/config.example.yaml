# NodeNotificationsBot configuration example
#
# Copy to config/config.yaml (git-ignored) and adjust. Secrets can also be
# supplied through environment variables (see README):
#   TELEGRAM_BOT_TOKEN, BITCOIN_RPC_USER, BITCOIN_RPC_PASSWORD,
#   BITCOIN_RPC_URL, STORAGE_PATH, CONFIG_PATH, LOG_LEVEL

telegram:
  botToken: "123456:ABC..."          # or env TELEGRAM_BOT_TOKEN

bitcoin:
  network: signet                   # mainnet | testnet | signet | regtest
  rpc:
    url: "http://127.0.0.1:8332"
    # Generate the pair with: npm run rpc:auth -- nodenotificationsbot
    # bitcoin.conf (server side):
    #   rpcauth=nodenotificationsbot:<salt>$<hash>
    #   rpcwhitelist=nodenotificationsbot:getblockchaininfo,getnetworkinfo
    #   rpcwhitelistdefault=0
    user: "nodenotificationsbot"
    password: "REPLACE_WITH_RPCAUTH_PASSWORD"
    timeoutMs: 5000

storage:
  path: "/var/lib/nodenotificationsbot/bot.db"

ibdMonitor:
  sampleIntervalSeconds: 60         # shared RPC sampling loop
  progressStepPercent: 10           # notify every +N% of verification progress
